<h1 id="route-inventory--the-event-driven-org-wiring">Route inventory — the event-driven org wiring</h1>
<div class="grid-2">
<div class="box">
<h3>GitHub → PR and CI control loops</h3>
<ul class="tight">
<li><code>pr-review</code></li>
<li><code>pr-comment</code></li>
<li><code>pr-issue-comment</code></li>
<li><code>pr-ready-for-review</code></li>
<li><code>ci-failure</code></li>
<li><code>pr-merged</code></li>
<li><code>initiative-advance</code></li>
<li><code>pr-closed</code></li>
</ul>
</div>
<div class="box">
<h3>Linear / agentctl / cron → orchestration loops</h3>
<ul class="tight">
<li><code>linear-triage</code></li>
<li><code>linear-ticket-delegated</code></li>
<li><code>linear-ticket-undelegated</code></li>
<li><code>linear-ticket-auto-delegate</code></li>
<li><code>linear-ticket-auto-delegate-created</code></li>
<li><code>agentctl-supervisor</code></li>
<li><code>patrol</code></li>
<li><code>team-identity-sync</code></li>
<li><code>weekly-project-update</code></li>
</ul>
</div>
</div>
<div class="callout">
<strong>Noise control is part of the design.</strong> The real transforms include <code>relevant-events</code> (only PRs labeled <code>doink-active</code>), <code>linear-relevant</code>, and a 10-minute <code>dedup</code> window. Mechanical filtering is what keeps autonomy from drowning in event spam.
</div>

<h1 id="worked-example--one-real-delivery-loop">Worked example — one real delivery loop</h1>
<div class="flow-9">
<div class="step"><strong>1. Linear ticket enters Todo</strong><code>linear-ticket-auto-delegate</code> or <code>...-created</code> routes the event.</div>
<div class="step"><strong>2. Delegate to Doink</strong><code>linear-ticket-delegated</code> starts the unified pipeline.</div>
<div class="step"><strong>3. Research</strong><code>ticket-delegated-to-doink.md</code> builds context and writes a research artifact.</div>
<div class="step"><strong>4. Spec</strong>The same SOP turns research into options, recommendation, tests, and rollout shape.</div>
<div class="step"><strong>5. Classify</strong>Choose implement / incremental / defer, plus model, branch, and review depth.</div>
<div class="step"><strong>6. Implement</strong><code>agentctl launch</code> runs in an isolated worktree and reports back asynchronously.</div>
<div class="step"><strong>7. Supervisor</strong><code>agentctl-supervisor</code> evaluates the run, opens or updates a draft PR, and triggers QA.</div>
<div class="step"><strong>8. Polish loop</strong><code>ci-failure</code> + <code>pr-review</code>/<code>pr-comment</code> resolve failing checks and AI review issues.</div>
<div class="step"><strong>9. Human review + merge</strong><code>pr-ready-for-review</code> gates handoff; <code>pr-merged</code> and <code>initiative-advance</code> continue the loop.</div>
</div>
<div class="good">
<strong>Recurring example:</strong> a bounded internal platform ticket improves coding-agent completion callbacks so the originating control-plane session receives the PR URL, CI verdict, and verification evidence. Small enough to automate; rich enough to expose the full system.
</div>

<h1 id="step-1--eligible-ticket">Step 1 — Eligible ticket</h1>
<div class="grid-3">
<div class="box">
<h3>What makes work eligible</h3>
<ul class="tight">
<li>bounded scope</li>
<li>clear acceptance criteria</li>
<li>testable behavior</li>
<li>reversible rollout</li>
<li>known owner and code surface</li>
</ul>
</div>
<div class="box">
<h3>What gets kicked out</h3>
<ul class="tight">
<li>cross-tenant auth redesign</li>
<li>irreversible data migration without harnesses</li>
<li>customer-visible policy changes with weak rollback</li>
<li>ambiguous architecture work with no source of truth</li>
</ul>
</div>
<div class="box">
<h3>Concrete Kindo example</h3>
<ul class="tight">
<li>callback-reporting improvement: <strong>eligible</strong></li>
<li>touches known repos and known routes</li>
<li>can be verified with duplicate suppression, rendering, and retry tests</li>
<li>can be rolled back by reverting the PR or disabling the path</li>
</ul>
</div>
</div>
<div class="callout">
<strong>AI-native transformation starts with discipline at intake.</strong> If weakly bounded work enters the lane, every downstream metric becomes uninterpretable.
</div>
</section>

<h1 id="step-2--research--context-assembly">Step 2 — Research / context assembly</h1>
<div class="grid-3">
<div class="box">
<h3>What the real SOP does</h3>
<ul class="tight">
<li>reads the ticket, comments, linked PRs, and linked issues</li>
<li>queries retrieval across Slack, Linear, Notion, and code</li>
<li>searches prior PRs and directly greps the monorepo</li>
<li>pulls external docs when the ticket touches outside systems</li>
</ul>
</div>
<div class="box">
<h3>Concrete artifact</h3>
<ul class="tight">
<li>branch: <code>research/$TICKET_ID</code></li>
<li>artifact path: <code>docs/artifacts/$YEAR_MONTH/$TICKET_ID/RESEARCH.md</code></li>
<li>status comment: <strong>🔍 Auto-Research Complete</strong></li>
<li>contains citations, prior art, recommended approach, and open questions</li>
</ul>
</div>
<div class="box">
<h3>Why this matters</h3>
<ul class="tight">
<li>the 8-word ticket gets inflated into a usable dossier</li>
<li>humans stop hand-carrying hidden context in DMs</li>
<li>later rejection can be diagnosed as missing context vs model weakness</li>
</ul>
</div>
</div>
<div class="good">
<strong>Example:</strong> for callback reporting, research should pull prior lost-completion incidents, the existing session callback contract, notification conventions, related queue or webhook code, and any prior PRs that changed supervisor behavior.
</div>

<h1 id="step-3--spec-generation">Step 3 — Spec generation</h1>
<div class="grid-3">
<div class="box">
<h3>Spec contents</h3>
<ul class="tight">
<li>options considered</li>
<li>recommended design</li>
<li>files and interfaces likely touched</li>
<li>risk analysis</li>
<li>tests, rollout, and rollback plan</li>
</ul>
</div>
<div class="box">
<h3>Why it is load-bearing</h3>
<ul class="tight">
<li>the execution layer needs a machine-usable definition of done</li>
<li>human disagreements can be traced back to an explicit plan</li>
<li>review stops being “I would have done it differently” theater</li>
</ul>
</div>
<div class="box">
<h3>Concrete example</h3>
<ul class="tight">
<li>compare webhook callback vs polling vs queue consumer</li>
<li>recommend idempotent callback + audit record + retry budget</li>
<li>explicitly require evidence rendering in the originating control-plane session</li>
</ul>
</div>
</div>
<div class="callout">
A good spec already names the future verification burden: duplicate-callback suppression, retry semantics, session rendering, failure telemetry, and rollback behavior are not “later QA”; they are part of the design itself.
</div>

<h1 id="step-4--classification-is-where-cost-and-risk-get-shaped">Step 4 — Classification is where cost and risk get shaped</h1>
<div class="grid-4">
<div class="box">
<h3>One-shot implement</h3>
<p>Known pattern, strong tests, low blast radius. Cheap lane.</p>
</div>
<div class="box">
<h3>Parallel candidates</h3>
<p>Multiple plausible designs. Launch 2–3 isolated implementations and pick the strongest evidence bundle.</p>
</div>
<div class="box">
<h3>Incremental</h3>
<p>Break work into sub-issues or follow-on tasks when the spec says autonomy should proceed in phases.</p>
</div>
<div class="box">
<h3>Defer / escalate</h3>
<p>Missing context, architecture ambiguity, risky domain, or weak verification story.</p>
</div>
</div>
<div class="good">
<strong>Concrete Kindo pattern:</strong> the unified ticket-delegated SOP explicitly thinks in terms like <code>IMPLEMENT</code>, <code>INCREMENTAL</code>, and <code>DEFER</code>. Classification is not cosmetic; it decides runtime, timeouts, parallelism, and when humans stay close.
</div>
<div class="warn">
This is also where model ideology should die. Some routes pin specific models today because the workflow is what matters; models are replaceable components inside that workflow.
</div>
</section>

<h1 id="step-5--implementation-runtime">Step 5 — Implementation runtime</h1>
<div class="grid-2">
<div class="box">
<h3>What the runtime actually needs</h3>
<ul class="tight">
<li>isolated worktree / branch</li>
<li>scoped tool access</li>
<li>callback metadata so the result returns to the right supervisor</li>
<li>time budget long enough for serious work</li>
<li>ability to open a draft PR with traceable provenance</li>
</ul>
</div>
<div class="box">
<h3>Concrete operational pattern</h3>
<ul class="tight">
<li><code>agentctl launch</code> runs the coding agent asynchronously</li>
<li>the run can happen multiple times in parallel on separate branches</li>
<li>the output is not “chat text” — it is commits, a PR, test results, and a candidate rationale</li>
<li>the winning candidate is chosen on evidence quality, not eloquence</li>
</ul>
</div>
</div>
<div class="callout">
<strong>Example:</strong> launch three candidate branches for the callback ticket, each in its own worktree. One implementation may be simpler, one safer, one more extensible. The system should compare their artifacts, not ask a human to remember which chat felt smartest.
</div>

<h1 id="step-55--the-supervisor-is-the-async-glue">Step 5.5 — The supervisor is the async glue</h1>
<blockquote>
“You are the buffer between noisy agent lifecycle events and the user.”
</blockquote>
<div class="grid-2">
<div class="box">
<h3>Actual route + SOP</h3>
<ul class="tight">
<li>route: <code>agentctl-supervisor</code></li>
<li>event: <code>session.stopped</code></li>
<li>session key: <code>orgloop:coding-agent:supervisor</code></li>
<li>SOP: <code>coding-agent-supervisor.md</code></li>
<li><code>deliver: false</code> because this is high-frequency plumbing</li>
</ul>
</div>
<div class="box">
<h3>What it concretely does</h3>
<ul class="tight">
<li>recovers callback metadata and task context</li>
<li>checks session output, git status, recent commits, and PR state</li>
<li>opens or normalizes a draft PR</li>
<li>verifies pushes landed on the correct branch</li>
<li>decides whether to relaunch, polish, escalate, or stay silent</li>
</ul>
</div>
</div>
<div class="good">
<strong>Why this matters:</strong> without a supervisor layer, the system degenerates into raw model runs plus human babysitting. The supervisor is what turns isolated agent sessions into a coherent delivery loop.
</div>

<h1 id="step-6--verification-is-the-real-product">Step 6 — Verification is the real product</h1>
<div class="grid-2">
<div class="box">
<h3>Verification is broader than CI</h3>
<ul class="tight">
<li>lint / format / static checks</li>
<li>unit, integration, and end-to-end tests</li>
<li>AI review with bounded convergence logic</li>
<li>QA evidence comments, screenshots, logs, and traceability</li>
<li>security, architecture, and systems-safety checks</li>
</ul>
</div>
<div class="box">
<h3>The real Kindo polish loop</h3>
<ul class="tight">
<li><code>ci-failure</code> fixes failing jobs without scope creep</li>
<li><code>pr-review</code>, <code>pr-comment</code>, and <code>pr-issue-comment</code> address review feedback</li>
<li><code>pr-ready-for-review</code> only hands off once CI and AI review are genuinely clean</li>
<li>human review is downstream of enforcement, not the substitute for it</li>
</ul>
</div>
</div>
<div class="callout">
<strong>Core claim:</strong> the thing you should spend real engineering dollars on is not just bigger models. It is a stronger mechanical enforcement and evidence system around those models.
</div>
</section>

<h1 id="verification-deep-dive-i--code-quality-and-functional-correctness">Verification deep dive I — code quality and functional correctness</h1>
<table>
<thead>
<tr>
<th>Concern</th>
<th>Practical enforcement</th>
<th>Concrete example in the callback flow</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Format / lint / static types</strong></td>
<td>fail fast before human review</td>
<td>callback payload types line up; status rendering code passes lint and typecheck</td>
</tr>
<tr>
<td><strong>Unit tests</strong></td>
<td>narrow behavioral contracts</td>
<td>idempotency key suppresses duplicate callback handling</td>
</tr>
<tr>
<td><strong>Integration tests</strong></td>
<td>real component boundaries</td>
<td>agent completion event becomes a persisted callback record and session update</td>
</tr>
<tr>
<td><strong>End-to-end tests</strong></td>
<td>full workflow proof</td>
<td>a synthetic <code>session.stopped</code> event results in PR/evidence summary landing in the correct session</td>
</tr>
<tr>
<td><strong>Unused code / dependency hygiene</strong></td>
<td>prevent silent entropy</td>
<td>no orphan helper or dead retry path lands in the PR</td>
</tr>
<tr>
<td><strong>Review convergence</strong></td>
<td>bounded polish loop with stop conditions</td>
<td>the AI reviewer may request fixes, but the system decides whether review is converging or drifting into nonsense</td>
</tr>
</tbody>
</table>
<div class="good">
<strong>Practical standard:</strong> the PR should not say “tests added.” It should say which properties were proven, by which jobs, with which artifacts attached.
</div>

<h1 id="verification-deep-dive-ii--systems-infra-security-and-design-enforcement">Verification deep dive II — systems, infra, security, and design enforcement</h1>
<table>
<thead>
<tr>
<th>Concern</th>
<th>Practical enforcement</th>
<th>Concrete example in the callback flow</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Performance / regression</strong></td>
<td>benchmark or latency budget gates</td>
<td>callback delivery does not add unacceptable latency to agent completion handling</td>
</tr>
<tr>
<td><strong>Property testing / fuzzing</strong></td>
<td>generated edge-case inputs</td>
<td>malformed payloads, repeated delivery, and partial evidence bundles do not corrupt session state</td>
</tr>
<tr>
<td><strong>Formal verification where justified</strong></td>
<td>prove critical invariants on small surfaces</td>
<td>callback state-machine invariants: no double-finalization, no impossible status transitions</td>
</tr>
<tr>
<td><strong>Security / policy checks</strong></td>
<td>secret scanning, auth boundary checks, permission review</td>
<td>no webhook secret leaks; callback only writes to authorized sessions</td>
</tr>
<tr>
<td><strong>Distributed-systems review</strong></td>
<td>retry, idempotency, ordering, backpressure, failure-mode review</td>
<td>retries cannot create queue storms or duplicate human notifications</td>
</tr>
<tr>
<td><strong>Architecture conformance</strong></td>
<td>ADR / boundary / ownership checks</td>
<td>session rendering logic stays out of unrelated services; audit record remains in the intended ownership boundary</td>
</tr>
</tbody>
</table>
<div class="warn">
If you want autonomy on serious systems, you need verification for concurrency, retries, security, and architecture — not just “did the unit tests pass?”
</div>
</section>

<h1 id="deterministic-environments--cattle-not-pets">Deterministic environments — cattle, not pets</h1>
<div class="grid-2">
<div class="box">
<h3>What an AI-native test environment needs</h3>
<ul class="tight">
<li>ephemeral databases and queues</li>
<li>seed data and deterministic clocks</li>
<li>fixture payloads and replayable external API responses</li>
<li>one-command spin-up and teardown</li>
<li>logs, screenshots, traces, and artifacts collected automatically</li>
</ul>
</div>
<div class="box">
<h3>Concrete example</h3>
<ul class="tight">
<li>spin up a disposable callback receiver, queue, and session store</li>
<li>inject synthetic <code>session.stopped</code> events with success and failure variants</li>
<li>run deterministic e2e assertions on duplicate suppression, retry handling, and evidence rendering</li>
<li>tear everything down after the run so no hidden environment state survives</li>
</ul>
</div>
</div>
<div class="callout">
<strong>This is what “agentic E2E” actually means:</strong> agents can provision the test environment, execute the scenario, collect proof, and destroy the environment again. If the environment is a pet, the evidence will not be trustworthy enough for autonomy.
</div>
</section>

<h1 id="the-artifact-chain-underneath-the-workflow">The artifact chain underneath the workflow</h1>
<div class="grid-4">
<div class="artifact"><strong>1. Ticket state change</strong>Linear issue enters Todo or changes delegate.</div>
<div class="artifact"><strong>2. Research branch</strong><code>research/$TICKET_ID</code> plus <code>RESEARCH.md</code> with citations and prior art.</div>
<div class="artifact"><strong>3. Spec / plan</strong>options, recommendation, tests, rollout, rollback, open questions.</div>
<div class="artifact"><strong>4. Classification record</strong>implement vs incremental vs defer, runtime choice, timeout, review depth.</div>
<div class="artifact"><strong>5. Agent run</strong>isolated worktree, transcript, commits, branch, callback metadata.</div>
<div class="artifact"><strong>6. Draft PR</strong>summary, adapter/model provenance, linked ticket, labels like <code>doink-active</code>.</div>
<div class="artifact"><strong>7. QA evidence</strong>CI links, <strong>🧪 QA Evidence</strong> comment, AI-review status, logs/screenshots.</div>
<div class="artifact"><strong>8. Merge / release record</strong>telemetry snapshot, patrol follow-up, RCA or policy update if needed.</div>
</div>
<div class="good">
<strong>Autonomy is really an artifact discipline.</strong> If you cannot point to the artifact at each stage, you do not have a scalable autonomous workflow — you have a pile of opaque model transcripts.
</div>
</section>

<h1 id="step-7--human-review-should-be-the-last-smart-gate-not-the-first-real-one">Step 7 — Human review should be the last smart gate, not the first real one</h1>
<div class="grid-3">
<div class="box">
<h3>What is mechanically true first</h3>
<ul class="tight">
<li>draft PR exists</li>
<li>required CI is green</li>
<li>AI review has no unresolved threads</li>
<li>QA evidence comment is present</li>
<li>scope is focused</li>
</ul>
</div>
<div class="box">
<h3>What the human should still decide</h3>
<ul class="tight">
<li>is the design principled?</li>
<li>does the rollout shape make sense?</li>
<li>does this introduce a real systems risk the machinery missed?</li>
<li>is the work class ready to move deeper into autonomy next time?</li>
</ul>
</div>
<div class="box">
<h3>What the real ready-for-review SOP does</h3>
<ul class="tight">
<li>verifies QA evidence exists</li>
<li>checks CI again</li>
<li>checks unresolved AI-review threads</li>
<li>assigns reviewer using existing reviewer-resolution logic</li>
</ul>
</div>
</div>
<div class="callout">
<strong>Good rejection:</strong> “This retry policy could amplify queue storms.”  
<strong>Bad rejection:</strong> “I would have named this helper differently.”  
The first should become a reusable principle; the second should not collapse the lane.
</div>
</section>

<h1 id="step-8--merge-is-not-the-end-of-the-system">Step 8 — Merge is not the end of the system</h1>
<div class="grid-3">
<div class="box">
<h3>Post-merge control loops</h3>
<ul class="tight">
<li><code>pr-merged</code> handles cleanup and notification</li>
<li><code>initiative-advance</code> moves phased work to the next stage</li>
<li><code>pr-closed</code> detects abandoned work and closes the loop</li>
</ul>
</div>
<div class="box">
<h3>Operational patrol</h3>
<ul class="tight">
<li><code>patrol</code> hunts abandoned PRs, tickets, and stalled agents</li>
<li>this is the anti-rot mechanism</li>
<li>autonomy without patrol becomes backlog archaeology</li>
</ul>
</div>
<div class="box">
<h3>Executive visibility</h3>
<ul class="tight">
<li><code>weekly-project-update</code> keeps leadership informed</li>
<li><code>team-identity-sync</code> keeps ownership maps current</li>
<li>measurement and governance stay attached to the live workflow</li>
</ul>
</div>
</div>
<div class="good">
<strong>Concrete telemetry example:</strong> after a callback-related merge, monitor delivery latency, duplicate-suppression rate, failure rate, queue depth, and notification noise. If the canary is bad, rollback and feed the failure back into the verification layer.
</div>

<h1 id="step-9--learning-means-hardening-the-control-plane-itself">Step 9 — Learning means hardening the control plane itself</h1>
<div class="grid-3">
<div class="box">
<h3>Policy learning</h3>
<ul class="tight">
<li>turn real reviewer objections into planning principles</li>
<li>encode route filters and escalation rules</li>
<li>tighten what is considered eligible work</li>
</ul>
</div>
<div class="box">
<h3>Verification learning</h3>
<ul class="tight">
<li>add a new regression test after an escaped defect</li>
<li>add a new benchmark after a performance surprise</li>
<li>add a new failure-mode simulation after an incident</li>
</ul>
</div>
<div class="box">
<h3>Retrieval and routing learning</h3>
<ul class="tight">
<li>improve search coverage when context was missing</li>
<li>adjust transforms when noise or duplicates leaked through</li>
<li>split a route or SOP when one class of work needs different handling</li>
</ul>
</div>
</div>
<div class="callout">
<strong>Real examples from the Kindo plane:</strong> label-gating with <code>doink-active</code>, 10-minute dedup windows, and explicit <code>deliver: true/false</code> choices are all control-plane hardening moves. They are the result of learning, not decoration.
</div>

<h1 id="if-ai-ships-the-code-ai-must-help-carry-the-ops-burden">If AI ships the code, AI must help carry the ops burden</h1>
<div class="grid-2">
<div class="box">
<h3>Why the symmetry matters</h3>
<ul class="tight">
<li>leadership cannot demand AI throughput and then keep humans as the only first responders</li>
<li>higher change volume can mean more incidents in absolute terms</li>
<li>the system only remains fair if diagnosis and recovery also get automated</li>
</ul>
</div>
<div class="box">
<h3>Concrete Kindo example</h3>
<ul class="tight">
<li>during a rough week for platform stability, the AI on-call agent materially reduced blast radius</li>
<li>the human still owned the week, but fewer engineers got pulled in</li>
<li>that is the right proof shape: not perfection, but real leverage in a live environment</li>
</ul>
</div>
</div>
<div class="good">
<strong>Operational example:</strong> a callback rollout creates queue lag. The on-call agent correlates the recent merge, inspects logs and traces, proposes flag rollback or retry-budget adjustment, and prepares a human handoff if the incident exits known playbooks.
</div>

<h1 id="what-real-engineering-investment-in-autonomy-actually-buys">What real engineering investment in autonomy actually buys</h1>
<div class="grid-3">
<div class="box">
<h3>Not enough</h3>
<ul class="tight">
<li>buy a better model</li>
<li>ask engineers to use it more</li>
<li>leave review, QA, and on-call expectations unchanged</li>
</ul>
</div>
<div class="box">
<h3>What actually compounds</h3>
<ul class="tight">
<li>control-plane routing and SOP design</li>
<li>verification fabric and deterministic environments</li>
<li>artifact capture, provenance, and measurement</li>
<li>operational patrol, rollback, and incident support</li>
</ul>
</div>
<div class="box">
<h3>Concrete Kindo lesson</h3>
<ul class="tight">
<li>start with the strongest model to get the lane working</li>
<li>then step down or route laterally once evals and evidence justify it</li>
<li>the durable asset is the workflow and enforcement system, not loyalty to one model vendor</li>
</ul>
</div>
</div>
<div class="warn">
This is why the transformation is expensive in an interesting way: you are not just buying inference. You are buying a better delivery machine.
</div>

<h1 id="practical-rollout--how-to-start-without-pretending-the-whole-org-is-ready">Practical rollout — how to start without pretending the whole org is ready</h1>
<div class="flow-8">
<div class="step"><strong>1. Pick one lane</strong>Choose bounded internal platform work with rollback and strong ownership.</div>
<div class="step"><strong>2. Instrument the full path</strong>Capture ticket → research → spec → implementation → verification → review → release artifacts.</div>
<div class="step"><strong>3. Require evidence bundles</strong>No human review without CI, QA evidence, and traceable provenance.</div>
<div class="step"><strong>4. Build deterministic E2E</strong>Spin environments up and down like cattle; prove the workflow, not just unit tests.</div>
<div class="step"><strong>5. Add patrol + learning</strong>Recover rot, RCA failures, harden routes, improve retrieval.</div>
<div class="step"><strong>6. Expand cautiously</strong>Move more ticket classes into autonomy only where trust is earned.</div>
<div class="step"><strong>7. Pair with ops symmetry</strong>Increase AI-assisted diagnosis and response as AI ships more code.</div>
<div class="step"><strong>8. Rework incentives</strong>Reward the engineers who improve the machine, not only the humans who type the final line.</div>
</div>
<div class="callout">
<strong>Recommended first pilot shape:</strong> internal engineering-platform tickets like callback/reporting improvements, PR polish loops, CI-fix loops, and other reversible workflow automation. Those lanes teach the org how to build the system before it bets on larger product surfaces.
</div>

<h1 id="bottom-line">Bottom line</h1>
<div class="grid-2">
<div class="box">
<h3>What this deck is really saying</h3>
<ul class="tight">
<li>AI-native is a control-plane redesign</li>
<li>verification is the load-bearing layer</li>
<li>artifacts and evidence matter more than chat transcripts</li>
<li>operations and incentives must change with throughput</li>
</ul>
</div>
<div class="box">
<h3>What the Kindo example proves</h3>
<ul class="tight">
<li>the shape is not hypothetical</li>
<li>real event sources can already drive a real autonomous engineering loop</li>
<li>the remaining work is less “can models write code?” and more “can the org build the enforcement system around them?”</li>
</ul>
</div>
</div>
<blockquote>
The future state is not “the model got smarter.”  
The future state is “the company built a delivery system that knows how to use that intelligence safely, repeatedly, and at scale.”
